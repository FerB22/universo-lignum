 <style>
 :root {
 --bg-color: #120c08;
 --card-bg: #1c130c;
 --text-color: #e8dcc4;
 --accent-gold: #d4af37;
 --accent-bright: #f0c952;
 --muted-gold: #9e8237;
 --text-dim: #b8a686;
 --border-color: #3b2818;
 --quote-bg: rgba(212,175,55,0.06);
 --sidebar-bg: #160f09;
 --font-size-base: 18px;
 }
 body.theme-sepia {
 --bg-color:#241c14; --card-bg:#2d241a; --text-color:#edd9be;
 --border-color:#4a3a2a; --sidebar-bg:#1e160f;
 }
 body.theme-dark {
 --bg-color:#0a0705; --card-bg:#120e0a; --text-color:#d1c5b0;
 --border-color:#291e14; --sidebar-bg:#080604;
 }
 * { box-sizing:border-box; margin:0; padding:0; }
 body {
 background-color: var(--bg-color);
 color: var(--text-color);
 font-family: 'Lora', Georgia, serif;
 font-size: var(--font-size-base);
 line-height: 1.85;
 min-height: 100vh;
 padding: 20px;
 transition: background-color .3s, color .3s;
 background-image: radial-gradient(circle at 50% 0%, rgba(212,175,55,.07) 0%, transparent 65%);
 }
 .page-layout {
 max-width: 1300px;
 margin: 0 auto;
 display: grid;
 grid-template-columns: 1fr 260px;
 grid-template-rows: auto 1fr auto;
 gap: 0 24px;
 align-items: start;
 }
 /* Nav bar */
 .nav-bar {
 grid-column: 1 / -1;
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 13px 22px;
 background: var(--card-bg);
 border: 1px solid var(--border-color);
 border-radius: 8px;
 margin-bottom: 24px;
 box-shadow: 0 6px 24px rgba(0,0,0,.45);
 }
 .nav-back {
 color: var(--accent-gold);
 text-decoration: none;
 font-family: 'Cinzel', serif;
 font-size: 13px;
 font-weight: 600;
 letter-spacing: 1px;
 transition: color .2s, transform .2s;
 }
 .nav-back:hover { color:var(--accent-bright); transform:translateX(-3px); }
 .reader-controls { display:flex; align-items:center; gap:10px; }
 .btn-ctrl {
 background:rgba(212,175,55,.1); border:1px solid var(--border-color);
 color:var(--accent-gold); padding:5px 11px; border-radius:4px;
 cursor:pointer; font-family:'Cinzel',serif; font-size:13px; transition:all .2s;
 }
 .btn-ctrl:hover { background:var(--accent-gold); color:#120c08; }
 /* Main reading column */
 .main-col { min-width:0; }
 .chapter-header {
 text-align:center; margin-bottom:38px;
 padding-bottom:24px; position:relative;
 }
 .chapter-header::after {
 content:'&#10042; &#10042; &#10042;';
 position:absolute; bottom:0; left:50%; transform:translateX(-50%);
 color:var(--muted-gold); font-size:13px; letter-spacing:10px;
 }
 .sub-label {
 font-family:'Cinzel',serif; font-size:11px; letter-spacing:4px;
 text-transform:uppercase; color:var(--accent-gold);
 margin-bottom:10px; display:block;
 }
 .main-title {
 font-family:'Cinzel',serif; font-size:32px; font-weight:700;
 color:#f5eedc; letter-spacing:1px;
 text-shadow:0 4px 14px rgba(0,0,0,.7); margin-bottom:6px;
 }
 /* Reader frame */
 .reader-container {
 background:var(--card-bg); border:1px solid var(--border-color);
 border-radius:12px; padding:44px 50px;
 box-shadow:0 10px 38px rgba(0,0,0,.5); position:relative;
 }
 .reader-container::before {
 content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px;
 border:1px solid rgba(212,175,55,.12); border-radius:8px; pointer-events:none;
 }
 /* Prose */
 .prose p {
 margin-bottom: 20px;
 text-align: justify;
 text-indent: 0.75em;
 }
 .prose p.dialogue {
 text-indent: 0;
 padding-left: 10px;
 border-left: 2px solid rgba(212,175,55,.22);
 margin-bottom: 14px;
 }
 .prose p.dialogue-cont {
 text-indent: 0;
 padding-left: 10px;
 margin-top: -14px;
 margin-bottom: 14px;
 color: var(--text-dim);
 }
 .prose .scene-break {
 text-align:center; color:var(--muted-gold);
 font-size:15px; letter-spacing:10px; margin:32px 0; user-select:none;
 }
 .prose blockquote.epigraph {
 background:var(--quote-bg); border-left:3px solid var(--accent-gold);
 border-right:3px solid var(--accent-gold); padding:18px 24px;
 margin:0 auto 34px auto; border-radius:4px; text-align:center;
 font-style:italic; color:#f0e6d2; font-size:.97em;
 max-width:600px; box-shadow:0 3px 14px rgba(0,0,0,.25); text-indent:0;
 }
 /* Prev/Next nav */
 .chapter-nav {
 display:flex; justify-content:space-between; align-items:center;
 margin-top:34px; padding-top:20px; border-top:1px solid var(--border-color);
 }
 .chapter-nav a {
 font-family:'Cinzel',serif; font-size:13px; font-weight:600;
 color:var(--accent-gold); text-decoration:none; transition:color .2s;
 }
 .chapter-nav a:hover { color:var(--accent-bright); }
 /* Sidebar */
 .sidebar {
 background:var(--sidebar-bg); border:1px solid var(--border-color);
 border-radius:10px; padding:18px 14px;
 box-shadow:0 6px 22px rgba(0,0,0,.4);
 position:sticky; top:20px;
 max-height:calc(100vh - 40px); overflow-y:auto;
 }
 .sidebar::-webkit-scrollbar { width:4px; }
 .sidebar::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:4px; }
 .sidebar-title {
 font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px;
 text-transform:uppercase; color:var(--accent-gold);
 margin-bottom:14px; padding-bottom:10px;
 border-bottom:1px solid var(--border-color); text-align:center;
 }
 .sidebar-list { list-style:none; }
 .sidebar-list li { border-bottom:1px solid rgba(59,40,24,.5); }
 .sidebar-list li a {
 display:block; padding:8px 7px; font-size:12.5px;
 color:var(--text-dim); text-decoration:none; line-height:1.4;
 transition:color .2s, background .2s; border-radius:4px;
 }
 .sidebar-list li a:hover { color:var(--accent-gold); background:rgba(212,175,55,.06); }
 .sidebar-list li.active a {
 color:var(--accent-bright); font-weight:600;
 background:rgba(212,175,55,.1);
 }
 .ch-num {
 font-family:'Cinzel',serif; font-size:10px;
 color:var(--muted-gold); margin-right:5px;
 }
 /* Footer */
 .page-footer {
 grid-column:1 / -1; text-align:center;
 font-family:'Cinzel',serif; font-size:11.5px;
 color:var(--text-dim); margin-top:34px; opacity:.8;
 }
 .page-footer a { color:var(--accent-gold); text-decoration:none; }
 /* Responsive */
 @media (max-width:900px) {
 .page-layout { grid-template-columns:1fr; }
 .sidebar { position:static; max-height:none; display:none; }
 .sidebar.open { display:block; margin-top:18px; }
 .btn-sidebar { display:inline-block !important; }
 }
 @media (max-width:600px) {
 .reader-container { padding:26px 16px; }
 .main-title { font-size:22px; }
 .prose p { text-align:left; }
 }
 .btn-sidebar { display:none; }
 </style>

 }
 }
</style>

<script>
 var fontSize = 18;
 var themes = ['', 'theme-sepia', 'theme-dark'];
 var themeIdx = 0;
 function changeFontSize(d) {
 fontSize = Math.min(Math.max(14, fontSize + d), 26);
 document.documentElement.style.setProperty('--font-size-base', fontSize + 'px');
 }
 function toggleTheme() {
 document.body.classList.remove(themes[themeIdx]);
 themeIdx = (themeIdx + 1) % themes.length;
 if (themes[themeIdx]) document.body.classList.add(themes[themeIdx]);
 }
 function toggleSidebar() {
 document.getElementById('sidebar').classList.toggle('open');
 }
</script>
